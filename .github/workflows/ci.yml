name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, build, self-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 runs the *.check.mts files' TypeScript imports without a build step.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build (includes TypeScript)
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Self-checks (*.check.mts)
        run: |
          set -e
          find src supabase -name '*.check.mts' -print0 | sort -z | while IFS= read -r -d '' f; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

  database:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      # Starts a throwaway local Postgres with Supabase's auth/storage schemas and applies every
      # migration in supabase/migrations. Never touches the production project.
      - run: supabase db start
      - name: pgTAP tests (supabase/tests)
        run: supabase test db
